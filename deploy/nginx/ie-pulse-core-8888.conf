# ============================================================================
#  IE Pulse — CORE (unified) shell on port 8888
# ----------------------------------------------------------------------------
#  Serves the whole IE Pulse SPA (every module + the app switcher) at
#  /ietools/, and proxies each module's relative API calls to the shared
#  local backends already running on this server.
#
#  HOW TO USE
#    1. Build the unified bundle (on the dev machine):
#         npm run build:all
#       → outputs dist/all/  (base = /ietools/)
#    2. Copy the CONTENTS of dist/all/ into:
#         D:/Application/IE-Pulse/CORE/dist-main/
#       (so you have CORE/dist-main/index.html and CORE/dist-main/assets/...)
#    3. Paste this server { } block into the http { } context of nginx.conf
#       (alongside your existing :443 server block), then:
#         nginx -t
#         nginx -s reload
#
#  PREREQUISITES (the usual gotchas)
#    - Open inbound TCP 8888 in Windows Firewall (and any corp firewall),
#      or clients can't reach it even though it works locally on the server.
#    - Confirm the MES hub port below (9006) is correct AND running:
#         curl http://127.0.0.1:9006/workcells
#      (the dev proxy used 9009 — verify the prod port).
#    - The backends (9007 OLE+CycleTime, 5110 user-info, 9006 MES) are shared
#      OS services; this block just points at them — no per-port duplication
#      of the apps themselves.
# ============================================================================

server {
    listen      8888 ssl;
    server_name mypenm0iesvr02.corp.jabil.org;

    ssl_certificate     C:/nginx/conf/ssl/jabil.crt;
    ssl_certificate_key C:/nginx/conf/ssl/jabil.key;

    # ---- Convenience redirects: bare URLs land on the app root ----
    location = / {
        return 301 /ietools/;
    }
    location = /ietools {
        return 301 /ietools/;
    }

    # ---- Static SPA (the core build; Vite base = /ietools/) ----

    # Fingerprinted assets — safe to cache forever.
    location /ietools/assets/ {
        alias D:/Application/IE-Pulse/CORE/dist-main/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — never cache, so users always get the latest deployed build.
    location = /ietools/index.html {
        alias D:/Application/IE-Pulse/CORE/dist-main/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA entry + client-side routing fallback (React Router basename /ietools/).
    location /ietools/ {
        alias D:/Application/IE-Pulse/CORE/dist-main/;
        try_files $uri $uri/ /ietools/index.html;
    }

    # ---- API proxies (shared local backends) ----
    # Longest-prefix matching means these win over /ietools/ for /…/api/ paths.

    # OLE backend (FastAPI / uvicorn) — OLE routes are mounted at /api/*
    location /ietools/ole/api/ {
        proxy_pass         http://127.0.0.1:9007/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cycle Time — same backend, router prefix /api/cycle-time/*
    location /ietools/cycle-time/api/ {
        proxy_pass         http://127.0.0.1:9007/api/cycle-time/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MES data hub (Pulse module). FE calls /api/* ; hub serves at root,
    # so the trailing slash on proxy_pass strips the /api/ prefix.
    # NOTE: confirm this port (dev used 9009).
    location /api/ {
        proxy_pass         http://127.0.0.1:9006/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # AD user-info service (browser sees a same-origin /userinfo/ call).
    location /userinfo/ {
        proxy_pass         http://127.0.0.1:5110/User/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
